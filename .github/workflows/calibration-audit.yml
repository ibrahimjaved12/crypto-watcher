name: Calibration audit
run-name: "Calibration audit ${{ inputs.segment }}"

# Sigma calibration audit (#220 slice A; scripts/research/calibration_audit.py). Read-only:
# labels, the label engine and existing results are not changed. The full report goes to
# reports/calibration/ in the private research-data repository; this public log and the
# job summary carry only symbol, horizon, half-life, n and the sd, barrier and overall PASS/FAIL verdicts per row, the report
# hash, and allowlisted progress lines. The hidden segment is not offered here and is
# refused by the hidden guard in the script and the library.
on:
  workflow_dispatch:
    inputs:
      segment:
        description: "development | validation"
        type: choice
        options: [development, validation]
        default: development
      horizons:
        description: "Comma-separated horizons in minutes (subset of 15,60,240; 240 adds the barrier comparison)"
        type: string
        default: "15,60,240"
      half_lives:
        description: "Comma-separated EWMA half-lives in days (subset of 1,3,7)"
        type: string
        default: "1,3,7"
      label_revision:
        description: "lb label release revision (barrier comparison)"
        type: string
        default: "1"
      data_revision:
        description: "rd data release revision"
        type: string
        default: "1"
      sigma_models:
        description: "Comma-separated sigma models (subset of ewma,ewma-seasonal; each row is reported per model)"
        type: string
        default: "ewma,ewma-seasonal"
      seasonal_label_revision:
        description: "lb2 (labels-v2, ewma-seasonal) release revision for the seasonal barrier comparison"
        type: string
        default: "1"
      symbols:
        description: "Comma-separated symbols (subset of the six; symbols without an lb label release get barrier=NA)"
        type: string
        default: "BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,DOGEUSDT,XRPUSDT"

permissions:
  contents: read

concurrency:
  group: calibration-audit-${{ inputs.segment }}
  cancel-in-progress: false

jobs:
  audit:
    name: Calibration audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-research.txt
      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-research.txt
      - name: Run calibration audit
        env:
          SEGMENT: ${{ inputs.segment }}
          HORIZONS: ${{ inputs.horizons }}
          HALF_LIVES: ${{ inputs.half_lives }}
          LABEL_REVISION: ${{ inputs.label_revision }}
          DATA_REVISION: ${{ inputs.data_revision }}
          SYMBOLS: ${{ inputs.symbols }}
          SIGMA_MODELS: ${{ inputs.sigma_models }}
          SEASONAL_LABEL_REVISION: ${{ inputs.seasonal_label_revision }}
          AUDIT_SUMMARY: ${{ runner.temp }}/calibration-summary.md
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: |
          python/.venv/bin/python scripts/research/calibration_audit.py --workdir calibration-audit-work \
            --summary "$AUDIT_SUMMARY" --segment "$SEGMENT" --horizons "$HORIZONS" --half-lives "$HALF_LIVES" \
            --label-revision "$LABEL_REVISION" --data-revision "$DATA_REVISION" --symbols "$SYMBOLS" \
            --sigma-models "$SIGMA_MODELS" --seasonal-label-revision "$SEASONAL_LABEL_REVISION"
      - name: Delete working files
        if: always()
        run: rm -rf calibration-audit-work
      - name: Summary
        if: always()
        env:
          AUDIT_SUMMARY: ${{ runner.temp }}/calibration-summary.md
        run: |
          if [ -f "$AUDIT_SUMMARY" ]; then
            cat "$AUDIT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi
