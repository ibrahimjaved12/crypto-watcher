name: Alert chart renderer

# The machine-side renderer (python/market_analysis_tools/alert_charts.py) needs matplotlib, which
# stays out of the default 3-minute Python job. The default job runs the same test module with the
# rendering tests skipped; this job installs python/requirements-machine.txt and runs them.
on:
  pull_request:
    paths:
      - python/market_analysis_tools/**
      - python/tests/test_alert_charts.py
      - python/requirements-machine.txt
      - .github/workflows/alert-charts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alert-charts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Alert chart rendering tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-machine.txt
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q -r requirements.txt -r requirements-machine.txt
      - name: Run renderer tests
        env:
          ALERT_CHARTS_REQUIRE_MATPLOTLIB: "1"
        run: .venv/bin/python -m unittest tests.test_alert_charts -v
      - name: Render the SYNTHETIC fixture charts
        if: always()
        run: .venv/bin/python -m market_analysis_tools.fixtures "$RUNNER_TEMP/alert-chart-fixtures"
      - name: Upload the fixture charts (synthetic, for the owner to look at)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-chart-fixtures
          path: ${{ runner.temp }}/alert-chart-fixtures/*.png
          retention-days: 14
          if-no-files-found: error
