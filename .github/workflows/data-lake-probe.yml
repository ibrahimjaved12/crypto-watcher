name: Data lake probe (E4)
run-name: 'Data lake probe ${{ inputs.symbol }} ${{ inputs.month }}'

# Read-only experiment for #183: can a hosted runner reach data.binance.vision,
# verify checksums, and stream one symbol-month of aggTrades without extracting?
# It publishes nothing and writes no releases.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Binance USD-M symbol
        type: string
        default: BTCUSDT
        required: true
      month:
        description: Month as YYYY-MM
        type: string
        default: '2025-01'
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Disk before
        run: df -h .
      - name: Probe one symbol-month
        env:
          PROBE_SYMBOL: ${{ inputs.symbol }}
          PROBE_MONTH: ${{ inputs.month }}
        run: python scripts/research/data_lake_probe.py --symbol "$PROBE_SYMBOL" --month "$PROBE_MONTH" --workdir probe-out
      - name: Disk after
        run: df -h .
      - name: Summary
        if: always()
        run: |
          if [ -f probe-out/report.json ]; then
            { echo '### Data lake probe report'; echo '```json'; cat probe-out/report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: data-lake-probe-report
          path: probe-out/report.json
          if-no-files-found: ignore
          retention-days: 30
