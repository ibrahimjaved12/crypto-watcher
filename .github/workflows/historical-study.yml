name: Manual frozen historical study
run-name: 'Campaign ${{ inputs.task_label || inputs.campaign_spec }} / ${{ inputs.phase }} ${{ inputs.period_index }} / ${{ inputs.handoff_key || inputs.operation }}'

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preflight, execute-period, aggregate]
        required: true
        default: preflight
      campaign_spec:
        description: Trusted main-branch research/campaigns JSON path
        type: string
        required: true
      phase:
        type: choice
        options: [development, validation, test]
        required: true
        default: development
      period_index:
        description: Exact frozen index 0..29; ignored for aggregate
        type: string
        default: '0'
      allow_test:
        description: Explicit authorization in addition to validated frozen parents
        type: boolean
        default: false
      resume_generation:
        description: Exact private recovery Release tag; empty only for first run
        type: string
      resume_manifest_sha:
        description: Trusted sealed recovery inventory SHA (required with tag)
        type: string
      handoff_key:
        description: Controller-issued deterministic identity; empty for legacy manual slices
        type: string
      task_label:
        description: Controller campaign/task/sequence label
        type: string
      job_minutes:
        description: Whole-job allocation; includes 15-minute setup/upload reserve
        type: choice
        options: ['16', '20', '30', '50', '60', '120', '180', '240', '300', '350']
        default: '60'

permissions:
  contents: read
  actions: read # Read this job's start timestamp only; no dispatch/cancel permission.

# Initially serialize every campaign, including differently named spec files.
concurrency:
  group: historical-study-platform
  cancel-in-progress: false

jobs:
  study:
    if: ${{ github.ref == 'refs/heads/main' && contains(fromJSON('["16","20","30","50","60","120","180","240","300","350"]'), inputs.job_minutes) }}
    outputs:
      managed: ${{ steps.entry.outputs.managed }}
      claimed: ${{ steps.entry.outputs.claimed }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.job_minutes) }}
    env:
      STUDY_HANDOFF_KEY: ${{ inputs.handoff_key }}
      STUDY_OPERATION: ${{ inputs.operation }}
      STUDY_CAMPAIGN_SPEC: ${{ inputs.campaign_spec }}
      STUDY_PHASE: ${{ inputs.phase }}
      STUDY_PERIOD_INDEX: ${{ inputs.period_index }}
      STUDY_ALLOW_TEST: ${{ inputs.allow_test }}
      STUDY_RESUME_GENERATION: ${{ inputs.resume_generation }}
      STUDY_RESUME_SHA: ${{ inputs.resume_manifest_sha }}
      STUDY_JOB_MINUTES: ${{ inputs.job_minutes }}
    steps:
      - name: Record actual job start before checkout/setup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '.jobs[] | select(.name == "study") | .started_at')
          epoch=$(date -u -d "$started" +%s)
          echo "STUDY_JOB_STARTED_EPOCH=$epoch" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: historical-platform
      - name: Establish stable layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/crypto-study
          mv "$GITHUB_WORKSPACE/historical-platform" /tmp/crypto-study/repo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Validate main-reachable full pins and checkout exact runtime
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py bootstrap
      - name: Claim new-campaign handoff before dependencies or input acquisition
        id: entry
        env:
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"control"' /tmp/crypto-study/transfers/campaign.json; then
            python /tmp/crypto-study/repo/scripts/research/github_campaign.py claim
          else
            test -z "$STUDY_HANDOFF_KEY"
            echo "managed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect capabilities of the exact pinned orchestration
        id: platform
        shell: bash
        run: |
          if grep -q "'dependency-key'" /tmp/crypto-study/repo/scripts/research/github_study.py; then
            echo "extended=true" >> "$GITHUB_OUTPUT"
          else
            echo "extended=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Hash both actual pinned requirements after bootstrap
        if: steps.platform.outputs.extended == 'true'
        id: dependencies
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py dependency-key
      - name: Restore pip downloads and wheels only
        if: steps.platform.outputs.extended == 'true'
        id: dependency-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.cache/pip
          key: ${{ steps.dependencies.outputs.key }}
      - name: Install both pinned dependency sets within setup deadline
        id: install
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py install-dependencies
      - name: Save dependency downloads and wheels only
        if: steps.platform.outputs.extended == 'true' && steps.install.outcome == 'success' && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/pip
          key: ${{ steps.dependencies.outputs.key }}
      - name: Reserve campaign allocation and acquire verified metadata only
        env:
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py metadata
      - name: Validate frozen phase parents before raw/test input access
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py validate-parents
      - name: Acquire explicit verified recovery generation to staging
        env:
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py restore
      - name: Acquire only selected-period original input chunks
        env:
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py inputs
      - name: Restore optional exact prepared-core cache
        if: steps.platform.outputs.extended == 'true'
        continue-on-error: true
        env:
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py cache-restore
      - name: Run credential-free science with private supervisor status transport
        id: scientific
        env:
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ steps.entry.outputs.managed == 'true' && secrets.RESEARCH_DATA_TOKEN || '' }}
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py run
      - name: Validate and snapshot committed recovery with ownership held
        if: always() && steps.scientific.outcome != 'skipped'
        id: snapshot
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py snapshot
      - name: Publish private parts then sealed manifest and verify publication
        id: publication
        if: always() && steps.snapshot.outcome == 'success'
        env:
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py publish
      - name: Accept independently verified publication in campaign control
        id: receipt
        if: always() && steps.entry.outputs.managed == 'true' && steps.publication.outcome == 'success'
        env:
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py record-receipt
      - name: Publish optional prepared cache after mandatory recovery
        if: always() && steps.platform.outputs.extended == 'true' && steps.publication.outcome == 'success'
        continue-on-error: true
        env:
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: python /tmp/crypto-study/repo/scripts/research/github_study.py cache-publish
      - name: Summarize scientific state and verified continuation independently
        if: always()
        env:
          STUDY_SCIENTIFIC_OUTCOME: ${{ steps.scientific.outcome }}
          STUDY_SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
          STUDY_PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        shell: bash
        run: |
          if [ "${{ steps.platform.outputs.extended }}" = true ]; then
            python /tmp/crypto-study/repo/scripts/research/github_study.py summary
          else
            echo "Legacy pinned runtime: scientific=$STUDY_SCIENTIFIC_OUTCOME snapshot=$STUDY_SNAPSHOT_OUTCOME publication=$STUDY_PUBLICATION_OUTCOME. Use its exact verified receipt; no runtime migration was performed." >> "$GITHUB_STEP_SUMMARY"
          fi
      # No upload-artifact: raw data, requests, logs and scientific evidence stay
      # private. Only the allowlisted publication receipt enters the job summary.

  handoff:
    needs: study
    if: always() && needs.study.outputs.managed == 'true' && needs.study.outputs.claimed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      STUDY_CAMPAIGN_SPEC: ${{ inputs.campaign_spec }}
      STUDY_PARENT_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Re-enter pinned stdlib control helper
        run: python scripts/research/github_campaign.py bootstrap
      - name: Dispatch only from verified receipt and atomic campaign intent
        env:
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/research/github_campaign.py dispatch
