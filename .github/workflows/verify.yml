name: Tests

# One cheap job (docs/ci-budget.md). Pull requests run the core Python tests, the Node tests, types
# and builds, and only the study-tier Python tests whose imports reach a changed file. The weekly
# schedule and manual dispatch run everything. No push-to-main run: merged code was verified on its PR.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "research/**"]
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python tests, Node tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - name: Install dependencies (Python and Node in parallel)
        run: |
          set -uo pipefail
          (python -m venv python/.venv \
            && python/.venv/bin/python -m pip install -q --disable-pip-version-check -r python/requirements.txt) &
          python_pid=$!
          (npm ci --no-audit --no-fund && npm ci --prefix tests --ignore-scripts --no-audit --no-fund) &
          node_pid=$!
          status=0
          wait "$python_pid" || { echo "::error::Python install failed"; status=1; }
          wait "$node_pid" || { echo "::error::Node install failed"; status=1; }
          exit "$status"
      - name: Select tests
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > changed.txt
            echo "full=false" >> "$GITHUB_ENV"
          else
            : > changed.txt
            echo "full=true" >> "$GITHUB_ENV"
          fi
          echo "changed files: $(wc -l < changed.txt)"
      - name: Run Python and Node lanes concurrently
        run: |
          set -uo pipefail
          lane_python() {
            local start=$SECONDS status=0
            python/.venv/bin/python python/tests/run_shard.py core --jobs 1 || status=1
            if [ "$full" = "true" ]; then
              python/.venv/bin/python python/tests/run_shard.py study --jobs 1 || status=1
              python/.venv/bin/python python/tests/run_shard.py study-heavy --jobs 1 || status=1
            else
              python/.venv/bin/python python/tests/run_shard.py study --jobs 1 --changed-file changed.txt || status=1
              echo "run_shard: study-heavy: deferred to the weekly full run (4 modules, about 2 minutes)"
            fi
            echo "$((SECONDS - start))" > python.seconds
            return "$status"
          }
          lane_node() {
            local start=$SECONDS status=0
            { npm test --prefix tests \
              && npx --no-install tsc --noEmit \
              && npm run build \
              && npm run collector:worker:build; } || status=1
            echo "$((SECONDS - start))" > node.seconds
            return "$status"
          }
          lane_python > python.log 2>&1 & python_pid=$!
          lane_node > node.log 2>&1 & node_pid=$!
          status=0
          wait "$python_pid" || { status=1; python_failed=1; }
          wait "$node_pid" || { status=1; node_failed=1; }
          for lane in python node; do
            echo "::group::$lane lane (${lane}.log)"
            cat "$lane.log"
            echo "::endgroup::"
          done
          python_line=$(grep -h '^run_shard:' python.log | tr '\n' ' ')
          node_line=$(grep -h 'Node test files passed' node.log | tr -d '\n')
          {
            echo "### Test budget"
            echo "- python lane: $(cat python.seconds 2>/dev/null || echo '?')s ${python_failed:+FAILED} — $python_line"
            echo "- node lane: $(cat node.seconds 2>/dev/null || echo '?')s ${node_failed:+FAILED} — $node_line"
            echo "- full run: $full"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
