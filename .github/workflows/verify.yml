name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run Python unit tests
        run: .venv/bin/python -m unittest discover -s tests -v

  node:
    name: Node tests, types and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - name: Install application dependencies
        run: npm ci
      - name: Install test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Run full Node test suite
        run: npm test --prefix tests
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Build application
        run: npm run build
      - name: Build collector worker
        run: npm run collector:worker:build
