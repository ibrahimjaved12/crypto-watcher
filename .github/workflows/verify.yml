name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Python tests run in three parallel shards (python/tests/shards.json; "rest" is every
  # module no other shard lists). Budget: the Python tests finish in under 3 minutes.
  python-heavy-a:
    name: Python tests · study part C
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-research.txt
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-research.txt
      - name: Run Python unit tests (study-c)
        run: .venv/bin/python tests/run_shard.py study-c

  python-heavy-b:
    name: Python tests · study core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-research.txt
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-research.txt
      - name: Run Python unit tests (study-core)
        run: .venv/bin/python tests/run_shard.py study-core

  python-rest:
    name: Python tests · benchmark and everything else
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-research.txt
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-research.txt
      - name: Run Python unit tests (rest)
        run: .venv/bin/python tests/run_shard.py rest

  python:
    # Single required status: passes only when every shard passed.
    name: Python tests
    needs: [python-heavy-a, python-heavy-b, python-rest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Python shard to succeed
        env:
          HEAVY_A: ${{ needs.python-heavy-a.result }}
          HEAVY_B: ${{ needs.python-heavy-b.result }}
          REST: ${{ needs.python-rest.result }}
        run: |
          echo "study-c=$HEAVY_A study-core=$HEAVY_B rest=$REST"
          test "$HEAVY_A" = success && test "$HEAVY_B" = success && test "$REST" = success

  node:
    name: Node tests, types and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - name: Install application dependencies
        run: npm ci
      - name: Install test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Run full Node test suite
        run: npm test --prefix tests
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Build application
        run: npm run build
      - name: Build collector worker
        run: npm run collector:worker:build
