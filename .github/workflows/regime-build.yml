name: Regime build
run-name: "Regime build"

# Objective regime/season table and pre-registered calendar hypotheses (#223;
# scripts/research/regime_build.py, docs/regime-labels.md). DESCRIPTIVE ONLY: nothing is a
# PASS and nothing enters the experiment ledger. Reads the dk1 daily releases of the six
# symbols and the BTCUSDT rd bars 2024-01..2025-12 (H3); the table is built through 2025-12
# and the hidden stretch is never read. The table (csv.gz), its JSON manifest and a Markdown
# summary go to reports/regime/ in the private research-data repository; this public log and
# the job summary carry only counts (rows written), the report hash and allowlisted progress
# lines.
on:
  workflow_dispatch:
    inputs:
      data_revision:
        description: "rd data release revision (BTCUSDT bars for H3)"
        type: string
        default: "1"
      daily_revision:
        description: "dk1 daily history release revision"
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: regime-build
  cancel-in-progress: false

jobs:
  build:
    name: Regime build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-research.txt
      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-research.txt
      - name: Build regime table
        env:
          DATA_REVISION: ${{ inputs.data_revision }}
          DAILY_REVISION: ${{ inputs.daily_revision }}
          BUILD_SUMMARY: ${{ runner.temp }}/regime-build-summary.md
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: |
          python/.venv/bin/python scripts/research/regime_build.py --workdir regime-build-work \
            --summary "$BUILD_SUMMARY" --data-revision "$DATA_REVISION" --daily-revision "$DAILY_REVISION"
      - name: Delete working files
        if: always()
        run: rm -rf regime-build-work
      - name: Summary
        if: always()
        env:
          BUILD_SUMMARY: ${{ runner.temp }}/regime-build-summary.md
        run: |
          if [ -f "$BUILD_SUMMARY" ]; then
            cat "$BUILD_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi
