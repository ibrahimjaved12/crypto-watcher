name: Candle table build
run-name: "Candle table build"

# candle-table-v1: one row per symbol x timeframe x completed candle with geometry, trend/volatility,
# volume, calendar, regime-v1 and forward-outcome groups (scripts/research/candle_table_build.py,
# docs/pattern-study.md). DESCRIPTIVE ONLY: nothing is a PASS and nothing enters the experiment
# ledger. Reads the dk1 daily releases (requested symbols plus BTCUSDT), the rk- kline 1-minute bars
# 2020-12..2023-12 (2020-12 warm-up; intraday rows from 2021-01, segment development-ext) and the rd
# aggTrades 1-minute bars 2024-01..through_month (column bar_source) when include_ext is true (default
# false: no rk- release is read and the table starts as before the extension); through_month is at most 2025-12
# and the hidden stretch is never read. DAILY_EXTRA_SYMBOLS are accepted for 1440/10080 only.
# The csv.gz files and manifest.json go to reports/candle-table/ct1__<hash16>/ in the private
# research-data repository (an existing directory with the same hash is skipped); this public log
# and the job summary carry only counts and the report hash, plus allowlisted progress lines.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "comma-separated symbols (the six; DAILY_EXTRA_SYMBOLS only with timeframes 1440,10080)"
        type: string
        default: "BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,DOGEUSDT,XRPUSDT"
      timeframes:
        description: "comma-separated candle minutes"
        type: string
        default: "15,60,240,1440,10080"
      through_month:
        description: "last month built (YYYY-MM, at most 2025-12)"
        type: string
        default: "2025-12"
      data_revision:
        description: "rd data release revision (1-minute bars)"
        type: string
        default: "1"
      daily_revision:
        description: "dk1 daily history release revision"
        type: string
        default: "1"
      include_ext:
        description: "include the extension: intraday development-ext 2021-01..2023-12 on rk- kline bars (2020-12 warm-up) and daily/weekly rows from 2020-01; needs the rk- releases. false = the table as before the extension"
        type: boolean
        default: false
      kline_revision:
        description: "rk kline 1-minute bars release revision (2020-12..2023-12)"
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: candle-table-build
  cancel-in-progress: false

jobs:
  build:
    name: Candle table build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-research.txt
      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-research.txt
      - name: Build candle table
        env:
          SYMBOLS: ${{ inputs.symbols }}
          TIMEFRAMES: ${{ inputs.timeframes }}
          THROUGH_MONTH: ${{ inputs.through_month }}
          DATA_REVISION: ${{ inputs.data_revision }}
          DAILY_REVISION: ${{ inputs.daily_revision }}
          KLINE_REVISION: ${{ inputs.kline_revision }}
          INCLUDE_EXT: ${{ inputs.include_ext }}
          BUILD_SUMMARY: ${{ runner.temp }}/candle-table-build-summary.md
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: |
          python/.venv/bin/python scripts/research/candle_table_build.py --workdir candle-table-work \
            --summary "$BUILD_SUMMARY" --symbols "$SYMBOLS" --timeframes "$TIMEFRAMES" \
            --through-month "$THROUGH_MONTH" --data-revision "$DATA_REVISION" --daily-revision "$DAILY_REVISION" \
            --kline-revision "$KLINE_REVISION" \
            $([ "$INCLUDE_EXT" = "true" ] && echo --include-ext)
      - name: Delete working files
        if: always()
        run: rm -rf candle-table-work
      - name: Summary
        if: always()
        env:
          BUILD_SUMMARY: ${{ runner.temp }}/candle-table-build-summary.md
        run: |
          if [ -f "$BUILD_SUMMARY" ]; then
            cat "$BUILD_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi
