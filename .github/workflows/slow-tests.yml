name: Slow statistical tests

# Acceptance tests marked @slow (python/tests/slow.py): the 1,000-trial noise
# calibration of SPA, StepM and best-trial DSR. Too slow for the 3-minute
# default Python job, so they run weekly, on demand, and on PRs that touch the
# multiple-testing code.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  pull_request:
    paths:
      - python/market_analysis/benchmark/spa.py
      - python/market_analysis/benchmark/stepm.py
      - python/market_analysis/benchmark/bootstrap.py
      - python/market_analysis/benchmark/dsr.py
      - python/market_analysis/benchmark/neff.py
      - python/market_analysis/benchmark/best_trial.py
      - python/market_analysis/benchmark/rng.py
      - python/tests/test_benchmark_calibration.py
      - python/tests/slow.py

permissions:
  contents: read

concurrency:
  group: slow-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calibration:
    name: Slow calibration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-research.txt
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-research.txt
      - name: Run slow acceptance tests
        env:
          RUN_SLOW_TESTS: "1"
        run: .venv/bin/python -m unittest tests.test_benchmark_calibration -v
