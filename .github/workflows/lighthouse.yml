name: Lighthouse

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/lighthouse.yml"
      - "scripts/lighthouse-summary.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://crypto-watcher.cwlabs.workers.dev
  LH_PAGES: |
    home|Home|/
    signin|Sign in|/auth

jobs:
  Lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Warm up pages
        shell: bash
        run: |
          while IFS='|' read -r slug label path; do
            [ -n "$slug" ] || continue
            if ! curl --retry 3 --retry-delay 5 -fsS -o /dev/null "$BASE_URL$path"; then
              echo "::warning::Warm-up request failed for $slug"
            fi
          done <<< "$LH_PAGES"

      - name: Run Lighthouse
        shell: bash
        run: |
          mkdir -p lighthouse-reports
          while IFS='|' read -r slug label path; do
            [ -n "$slug" ] || continue
            for device in mobile desktop; do
              output="lighthouse-reports/${slug}-${device}"
              preset=()
              if [ "$device" = desktop ]; then
                preset=(--preset=desktop)
              fi
              if npx --yes lighthouse@13 "$BASE_URL$path" \
                --quiet \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json \
                --output=html \
                --output-path="$output" \
                --chrome-flags="--headless=new --no-sandbox" \
                "${preset[@]}"; then
                for extension in json html; do
                  if [ -f "${output}.report.${extension}" ]; then
                    mv "${output}.report.${extension}" "${output}.${extension}"
                  fi
                done
              else
                echo "::warning::Lighthouse failed for ${slug} (${device})"
              fi
            done
          done <<< "$LH_PAGES"

      - name: Create summary
        if: always()
        run: >-
          node scripts/lighthouse-summary.mjs
          --dir lighthouse-reports
          --pages "$LH_PAGES"
          --base-url "$BASE_URL"
          --run-url
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          > lighthouse-comment.md
          && cat lighthouse-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update pull request comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- lighthouse-check -->")) | .id' | head -n1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@lighthouse-comment.md
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@lighthouse-comment.md
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore