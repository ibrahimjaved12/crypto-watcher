name: Experiment run
run-name: "Experiment ${{ inputs.mode }} ${{ inputs.question_id }} ${{ inputs.segment }}"

# One benchmark question per run (scripts/research/experiment_run.py). Questions, plans,
# hidden openings, the experiment ledger and reports live in the private research-data
# repository; this public log and the job summary carry only the script's public lines.
# Dispatch inputs are public: hypotheses and finalists live in private drafts/ files of
# the research-data repo, never in these inputs.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "register | plan | run | count (outcome-blind signal counts, development/validation only)"
        type: choice
        options: [register, plan, run, count]
        required: true
      question_id:
        description: Question id, e.g. ta-baselines-v1-60m
        type: string
        required: true
      segment:
        description: "run: development | validation | hidden; count: development | validation"
        type: choice
        options: [development, validation, hidden]
        default: development
      family:
        description: "register: signal family"
        type: choice
        options: [ta-baselines, order-flow, funding-basis]
        default: ta-baselines
      horizon:
        description: "register: horizon in minutes (15, 60 or 240; order-flow: 240; funding-basis: 240 or 60)"
        type: string
        default: "60"
      strategies:
        description: "register: comma-separated strategy names of the family or all"
        type: string
        default: all
      plan_id:
        description: "run hidden: plan id"
        type: string
        default: ""
      confirm_hidden:
        description: "run hidden: type the question id again to confirm"
        type: string
        default: ""
      label_revision:
        description: "register: label release revision"
        type: string
        default: "1"
      data_revision:
        description: "register: data release revision"
        type: string
        default: "1"
      seed:
        description: "register: bootstrap seed"
        type: string
        default: "20261009"

permissions:
  contents: read

concurrency:
  group: experiment-${{ inputs.question_id }}
  cancel-in-progress: false

jobs:
  experiment:
    name: Experiment ${{ inputs.mode }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-research.txt
      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-research.txt
      - name: Run ${{ inputs.mode }}
        env:
          MODE: ${{ inputs.mode }}
          QUESTION_ID: ${{ inputs.question_id }}
          SEGMENT: ${{ inputs.segment }}
          FAMILY: ${{ inputs.family }}
          HORIZON: ${{ inputs.horizon }}
          STRATEGIES: ${{ inputs.strategies }}
          PLAN_ID: ${{ inputs.plan_id }}
          CONFIRM_HIDDEN: ${{ inputs.confirm_hidden }}
          LABEL_REVISION: ${{ inputs.label_revision }}
          DATA_REVISION: ${{ inputs.data_revision }}
          SEED: ${{ inputs.seed }}
          EXPERIMENT_SUMMARY: ${{ runner.temp }}/experiment-summary.md
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: |
          args=(--workdir experiment-run-work --summary "$EXPERIMENT_SUMMARY" "$MODE" --question-id "$QUESTION_ID")
          case "$MODE" in
            register)
              args+=(--family "$FAMILY" --horizon "$HORIZON" --strategies "$STRATEGIES"
                     --label-revision "$LABEL_REVISION" --data-revision "$DATA_REVISION" --seed "$SEED") ;;
            plan) ;;
            count)
              args+=(--segment "$SEGMENT") ;;
            run)
              args+=(--segment "$SEGMENT")
              if [ "$SEGMENT" = "hidden" ]; then
                args+=(--plan-id "$PLAN_ID" --confirm-hidden "$CONFIRM_HIDDEN")
              fi ;;
          esac
          python/.venv/bin/python scripts/research/experiment_run.py "${args[@]}"
      - name: Delete working files
        if: always()
        run: rm -rf experiment-run-work
      - name: Summary
        if: always()
        env:
          EXPERIMENT_SUMMARY: ${{ runner.temp }}/experiment-summary.md
        run: |
          if [ -f "$EXPERIMENT_SUMMARY" ]; then
            cat "$EXPERIMENT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi
