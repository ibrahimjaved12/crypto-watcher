name: Doji event study
run-name: "Doji event study ${{ inputs.segment }}"

# Pre-registered doji event study on a candle-table-v1 report (scripts/research/pattern_study.py,
# docs/pattern-study.md). Descriptive only: no trades, labels, ledger entries or PASS/FAIL. The
# report (report.md, cells.csv, summary.json) goes to reports/pattern-study/ in the private
# research-data repository; this public log and the job summary carry only counts, the number of
# hypotheses examined, the private path and the report hash (never effect sizes). The hidden
# segment is not offered here and is refused by the hidden guard in the script and the library.
on:
  workflow_dispatch:
    inputs:
      segment:
        description: "development | validation"
        type: choice
        options: [development, validation]
        default: development
      table_report:
        description: "candle-table report hash (ct1__<hash16>) or reports/candle-table/... path"
        type: string
        required: true
      universe:
        description: "daily/weekly families: core (the frozen six) or core+extra (DAILY_EXTRA_SYMBOLS too)"
        type: choice
        options: [core, core+extra]
        default: core
      reference_report:
        description: "optional development doji report hash or path (validation runs only)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pattern-study-${{ inputs.segment }}
  cancel-in-progress: false

jobs:
  study:
    name: Doji event study
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-research.txt
      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-research.txt
      - name: Run study
        env:
          SEGMENT: ${{ inputs.segment }}
          TABLE_REPORT: ${{ inputs.table_report }}
          REFERENCE_REPORT: ${{ inputs.reference_report }}
          UNIVERSE: ${{ inputs.universe }}
          STUDY_SUMMARY: ${{ runner.temp }}/pattern-study-summary.md
          RESEARCH_DATA_REPOSITORY: ${{ vars.RESEARCH_DATA_REPOSITORY }}
          RESEARCH_DATA_TOKEN: ${{ secrets.RESEARCH_DATA_TOKEN }}
        run: |
          python/.venv/bin/python scripts/research/pattern_study.py --workdir pattern-study-work \
            --summary "$STUDY_SUMMARY" --segment "$SEGMENT" --table-report "$TABLE_REPORT" \
            --reference-report "$REFERENCE_REPORT" --universe "$UNIVERSE"
      - name: Delete working files
        if: always()
        run: rm -rf pattern-study-work
      - name: Summary
        if: always()
        env:
          STUDY_SUMMARY: ${{ runner.temp }}/pattern-study-summary.md
        run: |
          if [ -f "$STUDY_SUMMARY" ]; then
            cat "$STUDY_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi
