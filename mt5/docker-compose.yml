services:
  mt5:
    # Unpinned on purpose while we test; pin the tag if the spike (#393) passes.
    image: gmag11/metatrader5_vnc:2.1
    container_name: crypto-watcher-mt5
    restart: "no"
    volumes: ["./config:/config"]
    # Loopback only: 8001 is an RPyC bridge that allows code execution in the container.
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:8001:8001"]
    environment:
      - CUSTOM_USER=${MT5_VNC_USER:-mt5}
      - PASSWORD=${MT5_VNC_PASSWORD:?Set MT5_VNC_PASSWORD in mt5/.env}
